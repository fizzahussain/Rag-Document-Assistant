name: Bug Report
description: Create a report to help us reproduce and fix a bug
title: "[BUG]: "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please ensure sensitive details or API keys are removed from logs.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the issue...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: How can maintainers reproduce this bug?
      placeholder: |
        1. Upload file 'sample.pdf'
        2. Execute POST /api/v1/search query '...'
        3. See error response...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - FastAPI Backend
        - Gradio Frontend
        - Document Extractor Engine
        - Qdrant Vector Store
        - PostgreSQL Database
        - Docker Compose Setup
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment Details
      description: OS version, Python version, Docker version, etc.
      placeholder: e.g. Windows 11, Python 3.12, Docker Desktop 4.28

  - type: textarea
    id: logs
    attributes:
      label: Logs / Stack Traces
      description: Paste anonymized log output (remove secrets/keys!).
      render: shell
