services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rag_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    environment:
      APP_ENV: development

      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/${POSTGRES_DB:-rag_db}

      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Set AUTH_SECRET_KEY in .env}

      UPLOAD_DIR: /app/data/uploads

      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}

      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-llama3.2}

      CHUNK_CONTEXT_SUMMARY_ENABLED: ${CHUNK_CONTEXT_SUMMARY_ENABLED:-true}
      CHUNK_CONTEXT_LLM_STRIDE: ${CHUNK_CONTEXT_LLM_STRIDE:-12}

      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_LANGUAGE: ${OCR_LANGUAGE:-eng}
      OCR_DPI: ${OCR_DPI:-200}

      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
      OLLAMA_WARMUP_ON_STARTUP: ${OLLAMA_WARMUP_ON_STARTUP:-true}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-180}

      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-faster-whisper}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-small}
      TRANSCRIPTION_DEVICE: ${TRANSCRIPTION_DEVICE:-cpu}
      TRANSCRIPTION_COMPUTE_TYPE: ${TRANSCRIPTION_COMPUTE_TYPE:-int8}
      TRANSCRIPTION_LANGUAGE: ${TRANSCRIPTION_LANGUAGE:-}
      TRANSCRIPTION_BEAM_SIZE: ${TRANSCRIPTION_BEAM_SIZE:-5}
      TRANSCRIPTION_TIMEOUT_SECONDS: ${TRANSCRIPTION_TIMEOUT_SECONDS:-180}
      MAX_AUDIO_SIZE_MB: ${MAX_AUDIO_SIZE_MB:-25}
      ALLOWED_AUDIO_EXTENSIONS: ${ALLOWED_AUDIO_EXTENSIONS:-wav,mp3,m4a,ogg,webm,flac}

      HF_HOME: /app/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /app/.cache/huggingface/hub
      XDG_CACHE_HOME: /app/.cache

    volumes:
      - uploads:/app/data/uploads
      - hf_cache:/app/.cache/huggingface

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    environment:
      BACKEND_URL: http://backend:8000/api/v1
      FRONTEND_HOST: 0.0.0.0

    ports:
      - "7860:7860"

    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  uploads:
  hf_cache: