[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-document-assistant"
version = "0.1.0"
description = "Document ingestion and retrieval-augmented generation system"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.28,<1.0",
    "pydantic[email]>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "aiosqlite>=0.20,<1.0",
    "alembic>=1.13,<2.0",
    "pymupdf>=1.23,<2.0",
    "python-docx>=1.1,<2.0",
    "pandas>=2.2,<3.0",
    "beautifulsoup4>=4.12,<5.0",
    "httpx>=0.27,<1.0",
    "structlog>=24.1,<26.0",
    "python-multipart>=0.0.9,<1.0",
    "cryptography>=42,<47",
    "gradio>=6.0,<7.0",
    "pgvector>=0.3,<1.0",
    "faster-whisper>=1.2.1,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2.0",
    "pytest-cov>=4.1,<8.0",
    "ruff>=0.3,<1.0",
    "mypy>=1.9,<2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "backend",
    "backend.*",
    "frontend",
    "frontend.*",
]
exclude = [
    "data",
    "data.*",
    "tests",
    "tests.*",
    "storage",
    "storage.*",
    "scripts",
    "scripts.*",
]
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = ["--strict-config", "-ra"]
markers = [
    "unit: isolated tests",
    "integration: tests requiring persistence or vector storage",
    "e2e: complete application workflows",
    "security: authentication and authorization tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "RUF", "ASYNC"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["backend/migrations/"]


[tool.ruff.lint.per-file-ignores]
"frontend/app.py" = ["E501"]
"backend/tests/conftest.py" = ["E402"]